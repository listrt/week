<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>week</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      overflow-x: hidden;
    }

    /* 左上角按钮组 */
    .links {
      padding: 24px 0 0 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    /* 圆角方形按钮——很浅的灰色，大小适中 */
    .btn {
      display: inline-block;
      background: #f2f2f2;
      color: #1e1e1e;
      text-decoration: none;
      font-size: 15px;
      font-weight: 450;
      padding: 10px 18px;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      transition: background 0.15s ease;
      border: 1px solid #e8e8e8;
      letter-spacing: 0.2px;
      min-width: 140px;
      text-align: center;
    }

    .btn:hover {
      background: #e9e9e9;
    }

    /* 右下角 Rangtt —— 尺寸加大到接近屏幕高度的1/4，渐变文字，y轴略微上移 */
    .signature {
      position: fixed;
      right: 3vw;
      bottom: 8vh;               /* 上移：从原来的0提升到8vh，视觉上更舒服，不贴底 */
      font-size: 26vh;           /* 约屏幕高度的1/4 (26vh ≈ 1/4屏高) */
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 0.8;          /* 视觉裁切底部，使字底与底部对齐更自然 */
      /* 渐变：上深灰 → 下浅灰 */
      background: linear-gradient(to bottom, #3c3c3c 0%, #b0b0b0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      opacity: 0.92;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.02);
      z-index: -1;               /* 放在按钮下层，不干扰点击 */
    }

    /* 手机端隐藏 Rangtt（屏幕宽度小于640px时） */
    @media (max-width: 640px) {
      .signature {
        display: none;
      }

      .links {
        padding: 20px 0 0 20px;
      }
      .btn {
        min-width: 120px;
        padding: 9px 14px;
        font-size: 14px;
      }
    }

    /* 焦点可访问性 */
    .btn:focus-visible {
      outline: 2px solid #b0b0b0;
      outline-offset: 2px;
    }
    .btn:active, .btn:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <div class="links">
    <a href="https://week.rangtt.com/2026/W42.txt" target="_blank" rel="noopener noreferrer" class="btn">Week 42 (10.17)</a>
    <a href="https://week.rangtt.com/2026/W43.txt" target="_blank" rel="noopener noreferrer" class="btn">Week 43 (10.25)</a>
    <a href="https://week.rangtt.com/2026/W44.txt" target="_blank" rel="noopener noreferrer" class="btn">Week 44 (11.1)</a>
  </div>

  <div class="signature" aria-hidden="true">Rangtt</div>
</body>
</html>
